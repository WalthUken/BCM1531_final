const M={
normal:{sp:1.1,g:{fru:[.04,'≈ 0'],glu:[.5,'normale'],ins:[.15,'basse'],tg:[.25,'normaux']},ur:'rien',steps:[
{t:'Absorption intestinale',d:"Le fructose entre dans l'entérocyte par GLUT5, du côté de la lumière intestinale, puis en sort par GLUT2 (peut-être aussi GLUT5) vers la veine porte, qui mène au foie.",h:['lumen','ent','glut5','glut2','porte']},
{t:'Captation par le foie',d:"Le foie capte presque tout le fructose : il y a peu ou pas de fructose circulant. Son assimilation est indépendante de l'insuline, et il n'entraîne pas de sécrétion d'insuline par le pancréas, d'où son usage chez les diabétiques.",h:['porte','fru','gFru','gIns']},
{t:'Fructokinase',d:"La fructokinase phosphoryle le fructose en fructose-1-phosphate, en consommant un ATP.",h:['fru','fk','f1p']},
{t:'Aldolase B',d:"L'aldolase B clive le fructose-1-phosphate en deux trioses : la dihydroxyacétone-P et le glycéraldéhyde.",h:['f1p','ald','dhap','gly']},
{t:'Triokinase',d:"La triokinase phosphoryle le glycéraldéhyde en glycéraldéhyde 3-P. De son côté, la dihydroxyacétone-P peut donner le glycérol-3P.",h:['gly','tk','g3p','dhap','glp']},

{t:'La glycolyse sature',d:"Ces trioses arrivent plus vite que la voie glycolytique ne peut les prendre en charge : elle sature.",n:"Complément hors diapo : le fructose entre dans la glycolyse au niveau des trioses, après l'étape contrôlée par la PFK-1, donc sans ce frein.",h:['g3p','pyr','glyco']},

{t:'Fructosurie essentielle',d:"Le fructose reste dans le sang puis passe dans l'urine. Le trouble est bénin et asymptomatique.",h:['fru','leak','gFru','urine']}]},

{t:"Mutation de l'aldolase B",d:"La fructokinase fonctionne, mais le fructose-1-P n'est plus clivé : il s'accumule dans le foie.",h:['fru','fk','f1p','ald']},

let mode='normal',step=0,play=!matchMedia('(prefers-reduced-motion: reduce)').matches,toks=[],acc=0,spT=.9,stT=0,last=performance.now();
const $=id=>document.getElementById(id);
function add(s,col,w){const c=document.createElementNS(NS,'circle');c.setAttribute('r','4');c.setAttribute('fill',col);c.style.opacity=0;$('tok').appendChild(c);toks.push({c,s,d:0,w:w||0})}
function pile(){if(acc>=24)return;const i=acc++,c=document.createElementNS(NS,'circle');c.setAttribute('cx',276+(i%8)*8);c.setAttribute('cy',264+Math.floor(i/8)*8);c.setAttribute('r','3');c.setAttribute('fill',CO);$('acc').appendChild(c)}
function route(t){switch(t.s){case'a1':return'a2';case'a2':return'a3';case'a3':return mode==='fk'?'lk':'fk';case'fk':if(mode==='aldo'){pile();return null}add('alR',CO,.22);return'alD';case'alD':return'tk';case'tk':return'py';case'py':if(mode==='exc'&&Math.random()<.75){t.c.setAttribute('fill',AM);return'ac'}return'gl';case'ac':return'ay';case'ay':return'tg';case'tg':return'sb';case'alR':return'dh';case'dh':if(mode==='exc'){t.c.setAttribute('fill',AM);return'gt'}return null;case'gt':return'sb';default:return null}}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(play){spT+=dt;if(spT>=M[mode].sp){spT=0;add('a1',CO)}stT+=dt;if(stT>=6.5){go(step+1)}for(const t of toks){if(t.w>0){t.w-=dt;t.c.style.opacity=0;continue}t.d+=SPD*dt;if(t.d>=L[t.s]){const n=route(t);if(!n){t.dead=1;t.c.remove();continue}t.s=n;t.d=0;t.w=.22;t.c.style.opacity=0;continue}const p=at(t.s,t.d);t.c.setAttribute('cx',p[0]);t.c.setAttribute('cy',p[1]);t.c.style.opacity=1}toks=toks.filter(t=>!t.dead)}requestAnimationFrame(tick)}
function go(i){const st=M[mode].steps;step=(i+st.length)%st.length;stT=0;const s=st[step];$('ttl').textContent=s.t;$('txt').textContent=s.d;$('note').textContent=s.n||'';$('cnt').textContent='Étape '+(step+1)+' / '+st.length;$('dots').innerHTML='';st.forEach((_,j)=>{const d=document.createElement('span');d.className='dot'+(j===step?' on':'');d.onclick=()=>go(j);$('dots').appendChild(d)});document.querySelectorAll('#sv .hk').forEach(e=>e.classList.toggle('dim',!s.h.includes(e.dataset.k)))}
function gauge(k,v,tx){$('lv-'+k).style.transform='scaleX('+v+')';$('st-'+k).textContent=tx}
function setMode(m){mode=m;toks.forEach(t=>t.c.remove());toks=[];acc=0;$('acc').innerHTML='';spT=.9;document.querySelectorAll('.md').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));document.querySelectorAll('#sv [data-m]').forEach(e=>e.style.display=e.dataset.m===m?'':'none');$('gp').setAttribute('class',(m==='aldo'?'c-red':'c-purple')+' hk');$('ur').setAttribute('class',(m==='fk'?'c-coral':'c-gray')+' hk');$('st-ur').textContent=M[m].ur;const g=M[m].g;for(const k in g)gauge(k,g[k][0],g[k][1]);$('lv-glu').setAttribute('fill',m==='aldo'?'#E24B4A':'#378ADD');go(0)}
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);
const IC={pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>'};
function setPlay(p){play=p;$('play').innerHTML=p?IC.pause:IC.play;$('play').setAttribute('aria-label',p?'Pause':'Lecture')}
$('play').onclick=()=>setPlay(!play);
function theme(){const l=document.documentElement.dataset.theme==='light';$('theme').textContent=l?'Mode sombre':'Mode clair'}
$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('bcm1531-final-theme',n)}catch(e){}theme()};
theme();setMode('normal');setPlay(play);requestAnimationFrame(tick);
</script>
